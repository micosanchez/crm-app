# Netlify deployment configuration for Fieldtrack CRM (Next.js)
# The official Next.js runtime is auto-detected by Netlify; this file pins build settings.

[build]
  command = "npm run build"
  publish = ".next"
  # Always build — Netlify's monorepo change detection misfires on the
  # "crm application" base directory (space in path), canceling valid deploys.
  ignore = "exit 1"

[build.environment]
  NODE_VERSION = "20"

# Next.js runtime plugin (Netlify installs automatically for Next.js sites,
# declared explicitly for CI/CD reproducibility)
[[plugins]]
  package = "@netlify/plugin-nextjs"

# Daily notification sweep — 10:30 UTC = 6:30 AM Michigan (EDT).
# Calls /api/cron/notifications with CRON_SECRET.
[functions."notify-cron"]
  schedule = "30 10 * * *"

# Required environment variables (set in Netlify UI → Site settings → Environment variables):
#   NEXT_PUBLIC_SUPABASE_URL
#   NEXT_PUBLIC_SUPABASE_ANON_KEY
#   SUPABASE_SERVICE_ROLE_KEY  (server-only — outbox logging + daily reminders)
#   RESEND_API_KEY, NOTIFY_EMAIL (email sending)
#   CRON_SECRET                (any random string — protects /api/cron/notifications)
#   NOTIFY_FROM                (optional — set after verifying a domain in Resend)
